name: Gunluk Stop-Hedef Kontrolu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stop-hedef-kontrol:
    runs-on: ubuntu-latest
    name: Stop-Hedef Kontrolu
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stop-Hedef Kontrol
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stop_hedef_kontrol.py

      - name: Commit flag changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gecmis/*.json || true
          git diff --staged --quiet || git commit -m "[auto] Stop/Hedef bayraklari guncellendi"
          git pull --rebase --autostash || true
          git push || true
