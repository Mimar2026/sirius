name: Aylik Sirius Calistirmasi

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

# Workflow'a repo'ya yazma yetkisi ver
permissions:
  contents: write

jobs:
  # ============================================
  # ABD SISTEMLERI
  # ============================================
  
  abd-momentum:
    runs-on: ubuntu-latest
    name: ABD - Saf Momentum
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run ABD Momentum
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_system.py
      
      - name: Commit history changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gecmis/momentum.json || true
          git diff --staged --quiet || git commit -m "[auto] Momentum gecmis guncellendi"
          git pull --rebase --autostash || true
          git push || true
  
  abd-diverse:
    runs-on: ubuntu-latest
    name: ABD - Sektor Diverse
    needs: abd-momentum
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run ABD Diverse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_sector_diverse.py
      
      - name: Commit history changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gecmis/diverse.json || true
          git diff --staged --quiet || git commit -m "[auto] Diverse gecmis guncellendi"
          git pull --rebase --autostash || true
          git push || true
  
  abd-quality:
    runs-on: ubuntu-latest
    name: ABD - Quality Momentum
    needs: abd-diverse
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run ABD Quality
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_quality.py
      
      - name: Commit history changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gecmis/quality.json || true
          git diff --staged --quiet || git commit -m "[auto] Quality gecmis guncellendi"
          git pull --rebase --autostash || true
          git push || true
  
  # ============================================
  # BIST SISTEMLERI
  # ============================================
  
  bist-katilim:
    runs-on: ubuntu-latest
    name: BIST - Katilim Top 5
    needs: abd-quality
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run BIST Katilim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bist_momentum_katilim.py
      
      - name: Commit history changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gecmis/bist_katilim.json || true
          git diff --staged --quiet || git commit -m "[auto] BIST Katilim gecmis guncellendi"
          git pull --rebase --autostash || true
          git push || true
  
  bist-genel:
    runs-on: ubuntu-latest
    name: BIST - Genel Top 5
    needs: bist-katilim
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run BIST Genel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bist_momentum_genel.py
      
      - name: Commit history changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gecmis/bist_genel.json || true
          git diff --staged --quiet || git commit -m "[auto] BIST Genel gecmis guncellendi"
          git pull --rebase --autostash || true
          git push || true
