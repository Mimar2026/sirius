name: Aylik Sirius Calistirmasi

on:
  schedule:
    # Her ayin 1'i, 06:00 UTC = 09:00 Turkiye saati
    # cron formati: dakika saat gun-of-month ay haftanin-gunu
    - cron: '0 6 1 * *'
  
  # Manuel calistirma da mumkun olsun (test icin)
  workflow_dispatch:

jobs:
  run-sirius:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Sirius momentum system
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_system.py
