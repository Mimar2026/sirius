name: Aylik Sirius Calistirmasi

on:
  schedule:
    # Her ayin 1'i, 06:00 UTC = 09:00 Turkiye saati
    - cron: '0 6 1 * *'
  
  # Manuel calistirma da mumkun olsun
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: Saf Momentum (Orjinal sistem)
  # ============================================
  run-momentum:
    runs-on: ubuntu-latest
    name: Saf Momentum
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Sirius Momentum
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_system.py
  
  # ============================================
  # JOB 2: Sektor Cesitlendirmeli Momentum
  # ============================================
  run-diverse:
    runs-on: ubuntu-latest
    name: Sektor Cesitlendirme
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Sirius Diverse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_sector_diverse.py
  
  # ============================================
  # JOB 3: Quality Momentum
  # ============================================
  run-quality:
    runs-on: ubuntu-latest
    name: Quality Momentum
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Sirius Quality
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_quality.py
